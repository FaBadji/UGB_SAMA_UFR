<main class="auth-page">
  <section class="auth-panel">
    <h1>Vérification de l’e-mail</h1>
    <p>Saisissez le code à 6 chiffres reçu par e-mail pour activer votre compte.</p>
    <form (submit)="verify($event)">
      <label class="sr-only" for="verify-code">Code</label>
      <input id="verify-code" type="text" [(ngModel)]="code" placeholder="Code à 6 chiffres" required maxlength="6" inputmode="numeric" pattern="[0-9]{6}" />

      <button type="submit" [disabled]="loading()">Vérifier</button>
      <button type="button" (click)="resend()" [disabled]="resending()">{{ resending() ? 'Envoi…' : 'Renvoyer le code' }}</button>
      <p class="auth-message" aria-live="polite">{{ message() }}</p>
    </form>
    <p><a routerLink="/connexion">Retour à la connexion</a></p>
  </section>
</main>
