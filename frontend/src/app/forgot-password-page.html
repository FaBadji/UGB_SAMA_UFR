<main class="auth-page">
  <section class="auth-panel">
    <h1>Mot de passe oublié</h1>
    <p>Recevez un code pour réinitialiser votre mot de passe.</p>
    <form (submit)="sendCode($event)">
      <label class="sr-only" for="forgot-email">Email</label>
      <input id="forgot-email" type="email" name="email" placeholder="Email" required />
      <button type="submit">Envoyer le code</button>
      <p class="auth-message" aria-live="polite">{{ message }}</p>
    </form>
    @if (submittedEmail) {
      <button type="button" (click)="goToReset()">Saisir le code de réinitialisation</button>
    }
    <p><a routerLink="/connexion">Retour à la connexion</a></p>
  </section>
</main>
