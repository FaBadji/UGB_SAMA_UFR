<main class="schedule-page archive-page">
  <header class="schedule-header">
    <a class="schedule-brand" routerLink="/dashboard" aria-label="SAMA UFR, tableau de bord">
      <img src="/images/sama-ufr-logo.png" alt="SAMA UFR" />
    </a>

    <nav class="schedule-nav" aria-label="Navigation principale">
      <a routerLink="/dashboard">Accueil</a>
      <a routerLink="/emploi-du-temps">Schedule</a>
      <a routerLink="/deliberation">Résultats</a>
      <a class="active" routerLink="/archives">Archives</a>
    </nav>

    <div class="schedule-account">
      <button class="schedule-notifications" type="button" aria-label="Notifications">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
        </svg>
      </button>
      <span class="schedule-avatar" aria-label="Fatou Ba">FB</span>
      <a class="schedule-logout" routerLink="/connexion" aria-label="Se déconnecter">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 17l5-5-5-5M15 12H3M21 3v18" />
        </svg>
      </a>
    </div>
  </header>

  <section class="archive-hero" aria-label="Bienvenue sur les archives">
    <h1 class="sr-only">Bienvenue sur les archives</h1>
  </section>

  <section class="archive-content" aria-label="Archives des emplois du temps et délibérations">
    <div class="archive-controls">
      <div class="archive-type">
        <span class="archive-type-label">Type archive</span>
        <div class="archive-type-options" role="group" aria-label="Type archive">
          <button
            type="button"
            [class.selected]="archiveType === 'schedule'"
            [attr.aria-pressed]="archiveType === 'schedule'"
            (click)="setArchiveType('schedule')"
          >Emploi du temps</button>
          <button
            type="button"
            [class.selected]="archiveType === 'deliberations'"
            [attr.aria-pressed]="archiveType === 'deliberations'"
            (click)="setArchiveType('deliberations')"
          >Délibérations</button>
        </div>
      </div>

      <form class="archive-search" (submit)="search($event)">
        <label class="sr-only" for="archive-query">Rechercher une archive</label>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.3" />
          <path d="m16 16 4.5 4.5" />
        </svg>
        <input id="archive-query" name="search" type="search" placeholder="L1-MA-ALG" />
        <button type="submit">rechercher</button>
      </form>
    </div>

    <div class="schedule-cards archive-cards">
      @for (schedule of filteredSchedules; track schedule.id) {
        <article class="schedule-card" [style.background-image]="'url(' + schedule.image + ')'">
          <button
            class="favorite-button"
            [class.is-favorite]="isFavorite(schedule.id)"
            type="button"
            [attr.aria-label]="isFavorite(schedule.id) ? 'Retirer des favoris' : 'Ajouter aux favoris'"
            [attr.aria-pressed]="isFavorite(schedule.id)"
            (click)="toggleFavorite(schedule.id)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8z" />
            </svg>
          </button>
          <div class="card-information">
            <strong>{{ schedule.title }}</strong>
            <span>{{ schedule.status }}</span>
          </div>
          <div class="card-actions">
            <button class="card-action preview-action" type="button" disabled [attr.aria-label]="'Aperçu indisponible pour ' + schedule.title">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="8" />
                <circle cx="12" cy="12" r="2.5" />
              </svg>
            </button>
            <button class="card-action download-action" type="button" disabled [attr.aria-label]="'Téléchargement indisponible pour ' + schedule.title">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3v12m-5-5 5 5 5-5M5 17v3h14v-3" />
              </svg>
            </button>
          </div>
        </article>
      } @empty {
        <p class="empty-results">Aucune archive ne correspond à cette recherche.</p>
      }
    </div>

    <p class="archive-more">Explorez les archives<br />d’anciens résultats</p>
  </section>
</main>
