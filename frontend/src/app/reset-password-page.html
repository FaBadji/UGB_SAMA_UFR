<main class="auth-page">
  <section class="auth-panel">
    <h1>Réinitialiser le mot de passe</h1>
    <form (submit)="reset($event)">
      <label class="sr-only" for="reset-email">Email</label>
      <input id="reset-email" type="email" name="email" [value]="email" placeholder="Email" required />

      <label class="sr-only" for="reset-code">Code</label>
      <input id="reset-code" type="text" name="code" placeholder="Code à 6 chiffres" required maxlength="6" />

      <label class="sr-only" for="reset-password">Nouveau mot de passe</label>
      <input id="reset-password" type="password" name="password" placeholder="Nouveau mot de passe" required />

      <label class="sr-only" for="reset-password-confirmation">Répéter le mot de passe</label>
      <input id="reset-password-confirmation" type="password" name="passwordConfirmation" placeholder="Répéter le mot de passe" required />

      <button type="submit">Réinitialiser</button>
      <p class="auth-message" aria-live="polite">{{ message }}</p>
    </form>
    <p><a routerLink="/connexion">Retour à la connexion</a></p>
  </section>
</main>
